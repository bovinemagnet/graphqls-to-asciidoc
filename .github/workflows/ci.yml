name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    # -no-fail defers the pass/fail decision to the gate step below, so the
    # SARIF report is always produced and uploaded first. With -fmt sarif the
    # findings go to the file rather than stdout, so failing here would abort
    # the job without saying — or recording — what was found.
    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.27.1
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    # The build still fails on any finding; it just fails after the report has
    # been uploaded, and prints what gosec found.
    - name: Fail on gosec findings
      run: |
        count=$(jq '[.runs[].results[]] | length' results.sarif)
        if [ "$count" -gt 0 ]; then
          jq -r '.runs[].results[]
            | "\(.ruleId) \(.level): \(.message.text) "
            + "[\(.locations[0].physicalLocation.artifactLocation.uri)"
            + ":\(.locations[0].physicalLocation.region.startLine)]"' results.sarif
          echo "::error::gosec reported $count finding(s); see the Security tab"
          exit 1
        fi
        echo "gosec reported no findings"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o dist/graphqls-to-asciidoc-linux-amd64
        GOOS=darwin GOARCH=amd64 go build -o dist/graphqls-to-asciidoc-darwin-amd64
        GOOS=windows GOARCH=amd64 go build -o dist/graphqls-to-asciidoc-windows-amd64.exe
    
    - name: Test CLI functionality
      run: |
        mkdir -p dist
        ./dist/graphqls-to-asciidoc-linux-amd64 -schema test/schema.graphql > test-output.adoc
        [ -s test-output.adoc ] || (echo "Output file is empty" && exit 1)
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: dist/